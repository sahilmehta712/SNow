name: Build SnowEdge Consultancy

on:
  workflow_dispatch:
  push:
    paths:
      - "SnowEdge-Consultancy-v0.4.3.zip"
      - ".github/workflows/build-snowedge.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract SnowEdge project
        run: |
          rm -rf snowedge-project
          mkdir snowedge-project
          unzip -q "SnowEdge-Consultancy-v0.4.3.zip" -d snowedge-project

          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/snowedge-project" -name settings.gradle -print -quit)")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project directory:"
          echo "$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SnowEdge-Consultancy-v0.4.3-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
