name: Build SahilNow APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SahilNow-Android14-Prototype-v0.1.1-source.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Unpack SahilNow project
        run: |
          rm -rf sahilnow-project
          mkdir -p sahilnow-project
          unzip -q "SahilNow-Android14-Prototype-v0.1.1-source.zip" -d sahilnow-project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/sahilnow-project" -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SahilNow-v0.1.1-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
